name: Bug report
description: Report a reproducible problem in pi-sampler.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, session archives, generated delivery evidence, or customer data. For security issues, use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version, Pi version, or repository commit where the issue occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe sequence of commands and configuration needed to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
