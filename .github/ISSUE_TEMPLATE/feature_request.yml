name: Feature request
description: Propose a focused improvement to pi-sampler.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the problem before proposing a solution. Do not include credentials, session archives, generated delivery evidence, or customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the expected behavior, scope, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
