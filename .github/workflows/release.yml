name: Release Pi packages

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm that this is an intentional production package release
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Verify release ref and confirmation
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main; received $GITHUB_REF."
            exit 1
          fi
          if [[ "$CONFIRM_RELEASE" != "true" ]]; then
            echo "Release confirmation is required."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: governance/go.mod
          cache-dependency-path: governance/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@zkrausman"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:compliance
      - run: npm run validate:governance
      - run: npm run validate:pi-extensions
      - run: npm run validate:packages
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload immutable published-package SBOMs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: package-sboms-${{ github.sha }}
          path: extensions/*/sbom.cdx.json
          if-no-files-found: error
