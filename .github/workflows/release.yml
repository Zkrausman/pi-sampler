name: Validate release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: governance/go.mod
          cache-dependency-path: governance/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:governance
      - id: package-inventory
        run: |
          count="$(node --input-type=module -e "import { publishablePackages } from './scripts/validate-publishable-packages.mjs'; console.log((await publishablePackages()).length);")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - if: steps.package-inventory.outputs.count != '0'
        run: npm run validate:compliance
      - if: steps.package-inventory.outputs.count != '0'
        run: npm run validate:pi-extensions
      - if: steps.package-inventory.outputs.count != '0'
        run: npm run validate:packages
      - if: steps.package-inventory.outputs.count == '0'
        run: echo "No publishable package inventory; package validation, packing, publication, and SBOM upload are intentionally skipped."
