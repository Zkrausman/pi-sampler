name: Adversarial review evidence

on:
  # This event resolves the workflow from the trusted PR base/default branch.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  adversarial-review-attestation:
    # Required status check name: Adversarial review evidence. This event
    # resolves the workflow from a trusted branch. It never checks out or
    # executes PR-head files.
    name: Adversarial review evidence
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ADVERSARIAL_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ADVERSARIAL_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ADVERSARIAL_REVIEW_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      ADVERSARIAL_REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      # Check out only the immutable base commit containing this trusted
      # workflow and validator. Do not use the PR merge ref or head ref here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head commit objects without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/adversarial-review-git-askpass"
          trap 'rm -f "$askpass"' EXIT
          umask 077
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin "$ADVERSARIAL_REVIEW_HEAD_SHA"
          git cat-file -e "$ADVERSARIAL_REVIEW_BASE_SHA^{commit}"
          git cat-file -e "$ADVERSARIAL_REVIEW_HEAD_SHA^{commit}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate bounded commit-bound attestation without logging the PR body
        run: node scripts/validate-adversarial-review-attestation.mjs
