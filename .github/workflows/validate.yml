name: Validate Pi packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Bound stuck tests and runner failures; normal validation completes well below this limit.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:compliance
      - run: npm run validate:pi-extensions
      - run: npm run validate:packages

  changesets:
    # A package release decision is required only for a PR, never inferred from its title or labels.
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha }}
      CHANGESET_HEAD_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      # Use the PR head so the policy reads the same tree it compares, while
      # fetching the verified base SHA needed for a merge-base diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:changesets -- --base "$CHANGESET_BASE_REF" --head "$CHANGESET_HEAD_REF"

  dco:
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      DCO_BASE_REF: ${{ github.event.pull_request.base.sha }}
      DCO_HEAD_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: npm run validate:dco -- --base "$DCO_BASE_REF" --head "$DCO_HEAD_REF"

  governance:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: governance/go.mod
          cache-dependency-path: governance/go.sum
      - run: go test -race ./...
