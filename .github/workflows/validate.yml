name: Validate Pi packages

on:
  pull_request:
  # This event resolves this workflow from the trusted PR base branch. It is
  # deliberately separate from ordinary PR validation, which may run PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  # Review events resolve this workflow from the trusted default branch, so a
  # submitted, edited, or dismissed review revalidates the required check.
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Bound stuck tests and runner failures; normal validation completes well below this limit.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:compliance
      - run: npm run validate:pi-extensions
      - run: npm run validate:packages

  changesets:
    # A package release decision is required only for a PR, never inferred from its title or labels.
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      CHANGESET_BASE_REF: ${{ github.event.pull_request.base.sha }}
      CHANGESET_HEAD_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      # Use the PR head so the policy reads the same tree it compares, while
      # fetching the verified base SHA needed for a merge-base diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:changesets -- --base "$CHANGESET_BASE_REF" --head "$CHANGESET_HEAD_REF"

  dco:
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      DCO_BASE_REF: ${{ github.event.pull_request.base.sha }}
      DCO_HEAD_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run validate:dco -- --base "$DCO_BASE_REF" --head "$DCO_HEAD_REF"

  adversarial-review-attestation:
    # Required status check name: Adversarial review evidence. These events
    # resolve this workflow from a trusted branch. It never checks out or
    # executes PR-head files.
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review'
    name: Adversarial review evidence
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      ADVERSARIAL_REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ADVERSARIAL_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # github.head_ref is not set for pull_request_review events; this
      # payload field is available for both trusted event types.
      ADVERSARIAL_REVIEW_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      ADVERSARIAL_REVIEW_PR_BODY: ${{ github.event.pull_request.body }}
      ADVERSARIAL_REVIEW_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      ADVERSARIAL_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      ADVERSARIAL_REVIEW_REVIEWS_FILE: ${{ runner.temp }}/adversarial-review-reviews.json
    steps:
      # Check out only the immutable base commit containing this trusted
      # workflow and validator. Do not use the PR merge ref or head ref here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head commit objects without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/adversarial-review-git-askpass"
          trap 'rm -f "$askpass"' EXIT
          umask 077
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git fetch --no-tags origin "$ADVERSARIAL_REVIEW_HEAD_SHA"
          git cat-file -e "$ADVERSARIAL_REVIEW_BASE_SHA^{commit}"
          git cat-file -e "$ADVERSARIAL_REVIEW_HEAD_SHA^{commit}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Fetch GitHub review metadata and validate without logging private inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$ADVERSARIAL_REVIEW_REVIEWS_FILE"' EXIT
          gh api --method GET --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${ADVERSARIAL_REVIEW_PR_NUMBER}/reviews?per_page=100" > "$ADVERSARIAL_REVIEW_REVIEWS_FILE"
          test -s "$ADVERSARIAL_REVIEW_REVIEWS_FILE"
          node scripts/validate-adversarial-review-attestation.mjs

  governance:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: governance/go.mod
          cache-dependency-path: governance/go.sum
      - run: go test -race ./...
