name: Goal Loop

on:
  pull_request:
    paths:
      - 'plugins/goal-loop/**'
      - '.github/workflows/goal-loop.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/goal-loop/**'
      - '.github/workflows/goal-loop.yml'

permissions:
  contents: read

jobs:
  test:
    name: Goal Loop Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: plugins/goal-loop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: npm test
